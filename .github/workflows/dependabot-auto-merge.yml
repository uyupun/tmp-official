name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'uyupun/tmp-official'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Cache npm dependencies
        uses: actions/cache@v6
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
      # GITHUB_TOKENによるpushは他のワークフローをトリガーしないため、
      # mainへのpushで動かす別ワークフローではなく、マージ前のこのジョブ内で更新する。
      - name: Update biome.json schema version
        if: contains(steps.metadata.outputs.dependency-names, '@biomejs/biome')
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@biomejs/biome']")
          sed -i "s|https://biomejs.dev/schemas/[^/]*/schema.json|https://biomejs.dev/schemas/${VERSION}/schema.json|" biome.json

          git diff --quiet -- biome.json && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biome.json
          git commit -m "chore: update biome.json schema to v${VERSION}"
          git push origin "HEAD:${PR_HEAD_REF}"
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
